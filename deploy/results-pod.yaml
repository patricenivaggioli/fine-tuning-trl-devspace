apiVersion: v1
kind: Pod
metadata:
  name: gemma4-results
spec:
  restartPolicy: Never
  containers:
    - name: results
      image: image-registry.openshift-image-registry.svc:5000/__NAMESPACE__/gemma4-banking77:latest
      imagePullPolicy: IfNotPresent
      command:
        - bash
        - -lc
        - tensorboard --logdir /work/train/tensorboard --host 0.0.0.0 --port 6006
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      ports:
        - name: tensorboard
          containerPort: 6006
      volumeMounts:
        - name: artifacts
          mountPath: /work
          readOnly: true
  volumes:
    - name: artifacts
      persistentVolumeClaim:
        claimName: gemma4-banking77-artifacts
